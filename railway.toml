[build]
builder = "NIXPACKS"

[deploy]
# Backend lives in backend/, and main.py there exposes `app`.
startCommand = "if [ -f backend/main.py ]; then cd backend; fi; uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

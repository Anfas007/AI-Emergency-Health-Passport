version: \"3.8\"\n\nservices:\n  # MongoDB service for local development\n  mongodb:\n    image: mongo:7\n    container_name: health-passport-mongodb\n    ports:\n      - \"27017:27017\"\n    environment:\n      MONGO_INITDB_DATABASE: ai_emergency_health_passport\n    volumes:\n      - mongodb_data:/data/db\n    healthcheck:\n      test: [\"CMD\", \"mongosh\", \"--eval\", \"db.adminCommand('ping')\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # FastAPI Backend\n  backend:\n    build: .\n    container_name: health-passport-backend\n    ports:\n      - \"8000:8000\"\n    environment:\n      MONGO_URL: mongodb://mongodb:27017/ai_emergency_health_passport\n      MONGO_DB_NAME: ai_emergency_health_passport\n      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}\n      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002\n      DRUG_INTERACTION_DEBUG: \"true\"\n    depends_on:\n      mongodb:\n        condition: service_healthy\n    volumes:\n      - ./:/app\n    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\nvolumes:\n  mongodb_data:\n\nnetworks:\n  default:\n    name: health-passport-network\n
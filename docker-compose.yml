services:
  mongodb:
    image: mongo:7
    container_name: health-passport-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_emergency_health_passport
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-passport-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/ai_emergency_health_passport
      MONGO_DB_NAME: ai_emergency_health_passport
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002
      DRUG_INTERACTION_DEBUG: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:

networks:
  default:
    name: health-passport-network
